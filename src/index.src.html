<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>입출금 기록부</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="입출금">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 장부. 조용하고 정확하게, 숫자가 주인공
   IDEA: 은행 통장 인자면 — 날짜·적요·찾으신금액·맡기신금액·잔액 줄
   PICTURE: 첫 화면은 통장 4개 잔액과 이번 달 고정지출 체크 자체
   COLOUR and TYPE: 흑백 바탕 + 의미색(통장 4색, 입금 파랑·출금 빨강·이체 회색, 상태색, 항목색). IBM Plex Sans KR
   LAYOUT: 한 열, 하단 탭 4개, 하단 고정 입력 버튼 */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0f0f0f);--ink:light-dark(#111,#f1f1f1);--mut:light-dark(#6b6b6b,#9a9a9a);--line:light-dark(#d9d9d9,#333);--soft:light-dark(#f3f3f3,#1b1b1b)}
:root{--in:light-dark(#1565c0,#6ea8ff);--out:light-dark(#d32f2f,#ff7a7a);--tr:light-dark(#757575,#a8a8a8);--s-mi:light-dark(#d32f2f,#ff6b6b);--s-ye:light-dark(#e07b00,#ffad4d);--s-wa:light-dark(#2e7d32,#6fcf75)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{width:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none}
html{touch-action:pan-y;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans KR",system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.num{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
header{padding:calc(14px + env(safe-area-inset-top)) 18px 10px;border-bottom:3px double var(--ink);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h1{font-size:20px;margin:0;font-weight:700}
.sub{color:var(--mut);font-size:13px}
main{max-width:640px;margin:0 auto;padding:0 16px}
h2{font-size:15px;margin:26px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--ink);display:flex;justify-content:space-between;align-items:center}
.total{padding:20px 0 6px}.total .k{font-size:13px;color:var(--mut)}.total .v{font-size:clamp(24px,8.5vw,44px);white-space:normal;overflow-wrap:anywhere;font-weight:700;line-height:1.1;text-align:left}
.accts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.acct{border:1px solid var(--line);border-left:6px solid var(--c);padding:12px;border-radius:6px;background:color-mix(in srgb,var(--c) 7%,var(--bg))}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:6px;flex:none;vertical-align:middle}.acct b{display:block;font-size:14px}.acct span{font-size:12px;color:var(--mut)}.acct .num{font-size:clamp(15px,4.8vw,19px);font-weight:700;text-align:left;margin-top:4px;white-space:normal;overflow-wrap:anywhere}
.io{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:6px}.io>div{padding:10px 12px}.io>div+div{border-left:1px solid var(--line)}.io .k{font-size:12px;color:var(--mut)}.io .num{font-size:clamp(13px,4vw,16px);font-weight:700;text-align:left;white-space:normal;overflow-wrap:anywhere}.io>div{min-width:0}.io .cin{color:var(--in)}.io .cout{color:var(--out)}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row .grow{flex:1;min-width:0;overflow-wrap:anywhere}.row .t{font-weight:500}.row .d{font-size:12px;color:var(--mut)}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--ink);white-space:nowrap}
.tag.미납{background:var(--s-mi);border-color:var(--s-mi);color:#fff;font-weight:700}.tag.예정{border-color:var(--s-ye);color:var(--s-ye);font-weight:700}.tag.완료{border-color:var(--s-wa);color:var(--s-wa)}.tag.해당없음,.tag.대기{border-color:var(--line);color:var(--mut)}
button,select,input{font:inherit;color:inherit}
.btn{min-height:44px;padding:0 16px;border:1px solid var(--ink);background:var(--bg);border-radius:6px;cursor:pointer}
.btn.pri{background:var(--ink);color:var(--bg)}.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#add{position:fixed;left:0;right:0;margin:0 auto;bottom:calc(72px + env(safe-area-inset-bottom));width:calc(100% - 32px);max-width:600px;height:54px;font-size:18px;font-weight:700;border-radius:8px;border:0;background:var(--ink);color:var(--bg);z-index:5}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg);border-top:1px solid var(--ink);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{min-height:58px;border:0;background:none;font-size:14px;color:var(--mut)}nav button[aria-current=true]{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--ink)}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:16px 0 4px}.mnav b{font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{min-height:38px;padding:0 12px;border:1px solid var(--line);border-radius:99px;background:var(--bg);font-size:14px;cursor:pointer}.chip[aria-pressed=true]{background:var(--c,var(--ink));color:var(--t,var(--bg));border-color:var(--c,var(--ink));font-weight:700}.chip[aria-pressed=true] .dot{background:var(--t,var(--bg))}
.day{font-size:12px;color:var(--mut);margin-top:14px;padding-bottom:2px;border-bottom:1px solid var(--ink)}
.amt{font-weight:700}.amt.in{color:var(--in)}.amt.in::before{content:"+"}.amt.out{color:var(--out)}.amt.out::before{content:"−"}.amt.tr{color:var(--tr)}.amt.tr::before{content:"⇄ "}
table{width:100%;border-collapse:collapse;font-size:clamp(12px,3.6vw,14px);table-layout:fixed}td.num{white-space:normal;overflow-wrap:anywhere}th,td{overflow-wrap:anywhere;padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}th{font-weight:500;color:var(--mut);font-size:12px}td.num,th.num{text-align:right}
.bar{height:6px;background:var(--soft);margin-top:4px}.bar i{display:block;height:100%;background:var(--c,var(--ink))}
.empty{color:var(--mut);padding:18px 0;font-size:14px}
.note{font-size:13px;border:1px dashed var(--ink);padding:10px 12px;margin:14px 0;border-radius:6px}
label.f{display:block;margin:12px 0 0;font-size:13px;color:var(--mut)}
.inp{display:block;max-width:100%;-webkit-appearance:none;appearance:none;width:100%;min-height:46px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fx{border:1px solid var(--line);border-radius:6px;padding:4px 12px 12px;margin-bottom:8px}
#sheet{position:fixed;inset:0;background:rgb(0 0 0/.45);display:none;z-index:9;align-items:flex-end;justify-content:center}#sheet.on{display:flex}
#sheet .pan{background:var(--bg);width:min(100%,640px);max-height:92vh;overflow:auto;border-radius:12px 12px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));border-top:3px double var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--ink);border-radius:6px;overflow:hidden}.seg button{min-height:46px;border:0;background:var(--bg)}.seg button+button{border-left:1px solid var(--ink)}.seg button[data-ty=in]{color:var(--in)}.seg button[data-ty=out]{color:var(--out)}.seg button[data-ty=tr]{color:var(--tr)}.seg button[aria-pressed=true]{color:#fff;font-weight:700}.seg button[data-ty=in][aria-pressed=true]{background:var(--in)}.seg button[data-ty=out][aria-pressed=true]{background:var(--out)}.seg button[data-ty=tr][aria-pressed=true]{background:var(--tr)}
.big{font-size:clamp(22px,7vw,28px);font-weight:700;text-align:right}
.acts{display:flex;gap:8px;margin-top:18px}.acts .btn{flex:1}
#toast{position:fixed;left:16px;right:16px;margin:0 auto;width:fit-content;max-width:calc(100% - 32px);text-align:center;bottom:140px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
[hidden]{display:none!important}
.io.two{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:4px}
.seg.s4{grid-template-columns:repeat(4,1fr)}.seg.m3{grid-template-columns:repeat(3,1fr);border-color:var(--line)}
.seg button[data-ty=card]{color:#c2185b}.seg button[data-ty=card][aria-pressed=true]{background:#c2185b;color:#fff}
.seg button[data-me]{min-height:42px;font-size:14px}.seg button[data-me][aria-pressed=true]{background:var(--ink);color:var(--bg);font-weight:700}
.seg.m3 button+button{border-left-color:var(--line)}
.cal{margin-top:8px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.wk,.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wk span{text-align:center;font-size:12px;color:var(--mut);padding:6px 0;border-bottom:1px solid var(--line)}.wk span:first-child{color:var(--out)}.wk span:last-child{color:var(--in)}
.cd{min-height:58px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg);padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;overflow:hidden}
.grid7>.cd:nth-child(7n){border-right:0}.cd.blank{cursor:default}
.cd b{font-size:13px;font-weight:500}.cd.sun b{color:var(--out)}.cd.sat b{color:var(--in)}
.cd i{font-style:normal;font-size:10px;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:clip}.cd .ci{color:var(--in)}.cd .co{color:var(--out)}
.cd.today b{background:var(--ink);color:var(--bg);border-radius:99px;padding:0 6px}
.cd.sel{background:color-mix(in srgb,var(--ink) 10%,var(--bg));box-shadow:inset 0 0 0 2px var(--ink)}
h2 .btn.sm{font-weight:500}
</style>
</head>
<body>
<header><h1>입출금 기록부</h1><span class="sub" id="stat">불러오는 중…</span></header>
<main>
  <section id="v-home"></section>
  <section id="v-cal" hidden></section>
  <section id="v-list" hidden></section>
  <section id="v-sum" hidden></section>
  <section id="v-set" hidden></section>
</main>
<button id="add">+ 입력</button>
<nav>
  <button data-v="home" aria-current="true">홈</button><button data-v="cal">달력</button><button data-v="list">내역</button><button data-v="sum">요약</button><button data-v="set">설정</button>
</nav>
<div id="sheet" role="dialog" aria-modal="true" aria-label="거래 입력"><div class="pan" id="pan"></div></div>
<div id="toast" role="status"></div>
<script src="xlsx.bundle.js" defer></script>
<script>
/*CORE*/
</script>
<script>
{
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const won = n => Number(n || 0).toLocaleString('ko-KR');
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const AC = id => Core.acctColor(S, id);
const CC = n => Core.catColor(n);
const TX_ON = h => { const n = parseInt(h.slice(1), 16), L = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; return L > 0.6 ? '#111' : '#fff'; };
const daysSince = d => Math.floor((new Date(todayStr() + 'T00:00:00') - new Date(d + 'T00:00:00')) / 864e5);
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const dayLabel = d => { const x = new Date(d + 'T00:00:00'); return `${+d.slice(5, 7)}월 ${+d.slice(8)}일 (${WD[x.getDay()]})`; };

let S = Core.defaultSettings(todayStr());
let TX = [];
let view = 'home', month = Core.monthOf(todayStr()), filt = 'all';
let store = null; // {saveSettings, saveTx, delTx}
$('#add').disabled = true;
let lastExport = '';

function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2200); }

// ---------- 화면 ----------
const VIEWS = ['home', 'cal', 'list', 'sum', 'set'];
let calDay = todayStr();
const credits = () => (S.cards || []).filter(c => c.kind === 'credit');
const checks = () => (S.cards || []).filter(c => c.kind === 'check');
const man = n => { const a = Math.abs(n); return a >= 1e8 ? (n / 1e8).toFixed(1).replace(/\.0$/, '') + '억' : a >= 1e4 ? (a >= 1e5 ? Math.round(n / 1e4) : (n / 1e4).toFixed(1).replace(/\.0$/, '')) + '만' : String(n); };
const txTitle = t => t.type === 'tr' ? (Core.isCredit(S, t.to) ? `카드대금 ${Core.acctName(S, t.acct)} → ${Core.acctName(S, t.to)}` : `이체 ${Core.acctName(S, t.acct)} → ${Core.acctName(S, t.to)}`) : t.cat;
const txSub = t => t.type === 'tr' ? (t.memo || '') : (t.type === 'out' ? Core.methodLabel(S, t) + (t.method === 'bank' || !t.method ? ' · ' + Core.acctName(S, t.acct) : '') : Core.acctName(S, t.acct)) + (t.memo ? ' · ' + t.memo : '');
const txDotAcct = t => t.type === 'out' && t.method === 'check' ? t.card : t.acct;
const txRow = t => `<div class="row" role="button" tabindex="0" data-id="${esc(t.id)}"><span class="dot" style="--c:${AC(txDotAcct(t))}"></span><div class="grow"><div class="t">${t.type === 'tr' ? '' : `<span class="dot" style="--c:${CC(t.cat)};width:8px;height:8px;border-radius:2px"></span>`}${esc(txTitle(t))}</div><div class="d">${esc(txSub(t))}</div></div><div class="num amt ${esc(t.type)}">${won(t.amount)}</div></div>`;
function bindRows(root) { root.querySelectorAll('[data-id]').forEach(r => { const go = () => openSheet(TX.find(t => t.id === r.dataset.id)); r.onclick = go; r.onkeydown = e => { if (e.key === 'Enter') go(); }; }); }
function dayTotals(d) { let i = 0, o = 0; for (const t of TX) if (t.date === d) { if (t.type === 'in') i += t.amount; else if (t.type === 'out') o += t.amount; } return { i, o }; }

function render() {
  for (const v of VIEWS) $('#v-' + v).hidden = v !== view;
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', b.dataset.v === view));
  ({ home: rHome, cal: rCal, list: rList, sum: rSum, set: rSet })[view]();
}

function rHome() {
  const t = todayStr(), m = Core.monthOf(t), bal = Core.balances(S, TX), ms = Core.monthSummary(S, TX, m);
  const bank = S.accounts.reduce((a, x) => a + bal[x.id], 0), owe = credits().reduce((a, c) => a - bal[c.id], 0);
  const fs = Core.fixedStatus(S, TX, m, t);
  const today = Core.sortTx(TX).filter(x => x.date === t).reverse(), tt = dayTotals(t);
  $('#v-home').innerHTML = `
    <div class="total"><div class="k">순자산 · ${esc(t)} 기준</div><div class="v num">${won(bank - owe)}원</div>
      <div class="sub">통장 합계 ${won(bank)} − 신용카드 미결제 ${won(owe)}</div></div>
    <div class="accts">${S.accounts.map(a => `<div class="acct" style="--c:${AC(a.id)}"><b>${esc(a.name)}</b><span>${esc(a.use)}</span><div class="num">${won(bal[a.id])}</div></div>`).join('')}</div>
    ${credits().length ? `<h2>신용카드 미결제</h2>${credits().map(c => `<div class="row"><span class="dot" style="--c:${AC(c.id)}"></span><div class="grow"><div class="t">${esc(c.name)}</div><div class="d">결제 ${esc(Core.acctName(S, c.acct))}${c.payDay ? ' · 매월 ' + esc(c.payDay) + '일' : ''}</div></div><div class="num amt out">${won(-bal[c.id])}</div></div>`).join('')}` : ''}
    <h2>오늘 <span class="sub">${esc(dayLabel(t))}</span></h2>
    ${today.length ? `<div class="io two"><div><div class="k">입금</div><div class="num cin">${won(tt.i)}</div></div><div><div class="k">지출</div><div class="num cout">${won(tt.o)}</div></div></div><div id="today">${today.slice(0, 6).map(txRow).join('')}</div>${today.length > 6 ? `<div class="sub" style="margin-top:6px">외 ${today.length - 6}건 · 달력 탭에서 전체 보기</div>` : ''}`
      : `<div class="empty">오늘 기록 없음 · 아래 [+ 입력]으로 기록하세요.</div>`}
    <h2>${+m.slice(5)}월 수입·지출 <span class="sub">이체·카드대금 제외</span></h2>
    <div class="io"><div><div class="k">수입</div><div class="num cin">${won(ms.income)}</div></div><div><div class="k">지출</div><div class="num cout">${won(ms.expense)}</div></div><div><div class="k">순증감</div><div class="num">${won(ms.net)}</div></div></div>
    <h2>${+m.slice(5)}월 고정지출</h2>
    ${fs.map((x, i) => `<div class="row"><div class="grow"><div class="t"><span class="dot" style="--c:${CC(x.f.name)}"></span>${esc(x.f.name)}</div><div class="d">${x.f.day === '' ? '출금일 미설정' : `매월 ${esc(x.f.day)}일`} · ${esc(Core.acctName(S, x.f.acct))}${x.f.card ? ' → ' + esc(Core.acctName(S, x.f.card)) : ''} · ${x.paid ? won(x.paid) + '원 납부' : x.f.card ? '미결제액 납부' : x.f.variable ? '변동금액' : won(x.f.amount) + '원'}</div></div>
      <span class="tag ${esc(x.status)}">${esc(x.status)}</span>${x.status === '완료' || x.status === '해당없음' ? '' : `<button class="btn sm" data-pay="${i}">납부</button>`}</div>`).join('') || '<div class="empty">고정지출이 없습니다. 설정에서 추가하세요.</div>'}
    ${TX.length && (!lastExport || daysSince(lastExport) >= 7) ? `<div class="note"><b>엑셀 백업 권장</b> · 마지막 저장 ${lastExport ? esc(lastExport) + ' (' + daysSince(lastExport) + '일 전)' : '없음'}. 설정 탭에서 엑셀로 저장해 두세요.</div>` : ''}
    ${S.accounts.every(a => !a.start) && !TX.length ? `<div class="note">처음이시면 <b>설정</b>에서 통장 시작 잔액, 카드, 고정지출을 먼저 입력해 주세요.</div>` : ''}`;
  const td = $('#today'); if (td) bindRows(td);
  document.querySelectorAll('[data-pay]').forEach(b => b.onclick = () => {
    const f = S.fixed[+b.dataset.pay];
    if (f.card) openSheet({ type: 'tr', mode: 'card', acct: f.acct, to: f.card, amount: Math.max(0, -Core.balances(S, TX)[f.card] || 0) || '', date: todayStr(), memo: '' });
    else openSheet({ type: 'out', method: 'bank', acct: f.acct, cat: f.name, amount: f.variable ? '' : f.amount, date: todayStr(), memo: '' });
  });
}

function mnav() {
  return `<div class="mnav"><button class="btn sm" data-mv="-1" aria-label="이전 달">◀</button><b>${esc(month.slice(0, 4))}년 ${+month.slice(5)}월</b><button class="btn sm" data-mv="1" aria-label="다음 달">▶</button></div>`;
}

function rCal() {

let cur = null, delArm = false;
function openSheet(t) {
  const base = { type: 'out', method: 'bank', acct: S.accounts[0].id, to: S.accounts[1].id, card: '', cat: '', amount: '', date: todayStr(), memo: '' };
  cur = t && t.id ? { ...base, ...t } : { ...base, ...(t || {}) };
  if (cur.type === 'tr' && Core.isCredit(S, cur.to)) cur.mode = 'card';
  else if (cur.type === 'out' && cur.method === 'credit') { cur.card = cur.acct; }
  delArm = false; drawSheet(); $('#sheet').classList.add('on');
}
function closeSheet() { $('#sheet').classList.remove('on'); cur = null; }
function drawSheet() {
  const c = cur, mode = c.type === 'tr' && c.mode === 'card' ? 'card' : c.type;
  const cats = c.type === 'in' ? S.inCats : Core.outCats(S);
  const chips = (key, items) => `<div class="chips">${items.map(([v, n]) => { const col = key === 'cat' ? CC(v) : AC(v); return `<button class="chip" data-p="${key}" data-v="${esc(v)}" aria-pressed="${c[key] === v}" style="--c:${col};--t:${TX_ON(col)}"><span class="dot" style="--c:${col}"></span>${esc(n)}</button>`; }).join('')}</div>`;
  const banks = S.accounts.map(a => [a.id, a.name]);
  let who = '';
  if (mode === 'in') who = `<label class="f">통장</label>${chips('acct', banks)}`;
  else if (mode === 'tr') who = `<label class="f">보내는 통장</label>${chips('acct', banks)}<label class="f">받는 통장</label>${chips('to', S.accounts.filter(a => a.id !== c.acct).map(a => [a.id, a.name]))}`;
  else if (mode === 'card') who = credits().length ? `<label class="f">신용카드</label>${chips('to', credits().map(x => [x.id, x.name]))}<label class="f">출금 통장</label>${chips('acct', banks)}<div class="sub" style="margin-top:6px">현재 미결제액 ${won(-(Core.balances(S, TX)[c.to] || 0))}원 · 지출로 다시 집계되지 않습니다.</div>` : '<div class="note">설정 → 카드에서 신용카드를 먼저 추가해 주세요.</div>';
  else {
    who = `<label class="f">결제수단</label><div class="seg m3">${[['bank', '통장 출금'], ['check', '체크카드'], ['credit', '신용카드']].map(([v, n]) => `<button data-me="${v}" aria-pressed="${c.method === v}">${n}</button>`).join('')}</div>`;
    if (c.method === 'bank') who += `<label class="f">통장</label>${chips('acct', banks)}`;
    else { const list = c.method === 'check' ? checks() : credits(); who += list.length ? `<label class="f">${c.method === 'check' ? '체크카드' : '신용카드'}</label>${chips('card', list.map(x => [x.id, x.name + (c.method === 'check' ? ' (' + Core.acctName(S, x.acct) + ')' : '')]))}` : `<div class="note">설정 → 카드에서 ${c.method === 'check' ? '체크카드' : '신용카드'}를 먼저 추가해 주세요.</div>`; }
  }
  $('#pan').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><b>${c.id ? '거래 수정' : '거래 입력'}</b><button class="btn sm" id="x">닫기</button></div>
    <div class="seg s4">${[['in', '입금'], ['out', '지출'], ['tr', '이체'], ['card', '카드대금']].map(([v, n]) => `<button data-ty="${v}" aria-pressed="${mode === v}">${n}</button>`).join('')}</div>
    <label class="f">금액(원)</label><input class="inp big num" id="f-amt" inputmode="numeric" value="${c.amount === '' ? '' : won(c.amount)}" placeholder="0">
    ${who}
    ${mode === 'in' || mode === 'out' ? `<label class="f">항목</label>${chips('cat', cats.map(x => [x, x]))}` : ''}
    <div class="grid2"><div><label class="f">날짜</label><input class="inp" type="date" id="f-date" value="${esc(c.date)}"></div><div><label class="f">메모</label><input class="inp" id="f-memo" value="${esc(c.memo)}" maxlength="60"></div></div>
    <div class="sub" id="f-err" style="margin-top:10px;color:var(--out)"></div>
    <div class="acts">${c.id ? `<button class="btn" id="del">${delArm ? '한 번 더 누르면 삭제' : '삭제'}</button>` : `<button class="btn" id="more">저장 후 계속</button>`}<button class="btn pri" id="ok">저장</button></div>`;
  const keep = () => { c.amount = $('#f-amt').value === '' ? '' : Core.toInt($('#f-amt').value); c.date = $('#f-date').value; c.memo = $('#f-memo').value; };
  $('#x').onclick = closeSheet;
  $('#f-amt').oninput = e => { const v = e.target.value.replace(/[^0-9]/g, ''); e.target.value = v ? won(+v) : ''; };
  const fixTo = () => { if (c.mode === 'card') { if (!Core.isCredit(S, c.to)) c.to = credits()[0] ? credits()[0].id : ''; } else if (c.to === c.acct || !S.accounts.some(a => a.id === c.to)) c.to = S.accounts.find(a => a.id !== c.acct).id; };
  document.querySelectorAll('[data-ty]').forEach(b => b.onclick = () => {
    keep(); const v = b.dataset.ty; c.cat = '';
    if (v === 'card') { c.type = 'tr'; c.mode = 'card'; const cc = credits()[0]; if (cc) { c.to = cc.id; c.acct = cc.acct; } }
    else { c.type = v; c.mode = ''; if (!S.accounts.some(a => a.id === c.acct)) c.acct = S.accounts[0].id; }
    fixTo(); drawSheet();
  });
  document.querySelectorAll('[data-me]').forEach(b => b.onclick = () => { keep(); c.method = b.dataset.me; c.card = ''; if (!S.accounts.some(a => a.id === c.acct)) c.acct = S.accounts[0].id; drawSheet(); });
  document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
    keep(); c[b.dataset.p] = b.dataset.v;
    if (b.dataset.p === 'to' && c.mode === 'card') { const cc = Core.cardOf(S, c.to); if (cc) c.acct = cc.acct; }
    if (c.type === 'tr') fixTo(); drawSheet();
  });
  const save = cont => {
    keep(); const err = $('#f-err');
    if (c.amount === '' || c.amount < 0) return err.textContent = '금액을 입력해 주세요.';
    if (!c.date) return err.textContent = '날짜를 선택해 주세요.';
    let t;
    if (c.type === 'tr') {
      if (c.mode === 'card' && !Core.isCredit(S, c.to)) return err.textContent = '신용카드를 골라 주세요.';
      if (c.mode !== 'card' && (c.to === c.acct || !c.to)) return err.textContent = '받는 통장을 골라 주세요.';
      t = { type: 'tr', acct: c.acct, to: c.to, cat: '', method: '', card: '' };
    } else if (c.type === 'in') {
      if (!c.cat) return err.textContent = '항목을 골라 주세요.';
      t = { type: 'in', acct: c.acct, to: '', cat: c.cat, method: '', card: '' };
    } else {
      if (!c.cat) return err.textContent = '항목을 골라 주세요.';
      if (c.method === 'bank') t = { type: 'out', acct: c.acct, to: '', cat: c.cat, method: 'bank', card: '' };
      else {
        const cc = Core.cardOf(S, c.card); if (!cc || cc.kind !== c.method) return err.textContent = '카드를 골라 주세요.';
        t = c.method === 'check' ? { type: 'out', acct: cc.acct, to: '', cat: c.cat, method: 'check', card: cc.id } : { type: 'out', acct: cc.id, to: '', cat: c.cat, method: 'credit', card: cc.id };
      }
    }
    Object.assign(t, { id: c.id || ('t' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)), date: c.date, amount: c.amount, memo: c.memo.trim(), ts: c.ts || Date.now() });
    const i = TX.findIndex(x => x.id === t.id); if (i >= 0) TX[i] = t; else TX.push(t);
    store.saveTx(); render();
    if (cont) { c.amount = ''; c.memo = ''; drawSheet(); toast('저장했습니다 · 다음 건 입력'); setTimeout(() => { const a = $('#f-amt'); if (a) a.focus(); }, 30); }
    else { closeSheet(); toast(i >= 0 ? '수정했습니다' : '저장했습니다'); }
  };
  $('#ok').onclick = () => save(false);
  const mo = $('#more'); if (mo) mo.onclick = () => save(true);
  const d = $('#del'); if (d) d.onclick = () => { if (!delArm) { delArm = true; keep(); drawSheet(); return; } TX = TX.filter(x => x.id !== c.id); store.delTx(); closeSheet(); render(); toast('삭제했습니다'); };
}
$('#sheet').onclick = e => { if (e.target.id === 'sheet') closeSheet(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && cur) closeSheet(); });
$('#add').onclick = () => openSheet(view === 'cal' ? { date: calDay } : null);
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { view = b.dataset.v; render(); window.scrollTo(0, 0); });

// ---------- 엑셀 ----------
async function exportXlsx() {
  if (typeof XLSX === 'undefined') return toast('엑셀 기능을 불러오지 못했습니다. 앱을 다시 열어 주세요');
  const t = todayStr(), name = `입출금기록부_${t}.xlsx`;
  const buf = XLSX.write(Core.toWorkbook(XLSX, Core.workbookSpec(S, TX, t)), { type: 'array', bookType: 'xlsx' });
  const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const done = () => { lastExport = t; store.saveMeta({ lastExport }); toast('엑셀 파일을 만들었습니다'); render(); };
  try {
    const file = new File([blob], name, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return done(); }
  } catch (e) { if (e && e.name === 'AbortError') return toast('저장을 취소했습니다'); }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => a.remove(), 1000);
  setTimeout(() => URL.revokeObjectURL(url), 30000); done();
}

// ---------- 저장소 (이 기기 IndexedDB) ----------
let setTimer = null;
function saveSettings() { clearTimeout(setTimer); setTimer = setTimeout(() => store.saveSettings(), 400); }

function idbStore() {
  const open = () => new Promise((res, rej) => { const r = indexedDB.open('cashbook', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  let dbp = null; const db = () => dbp || (dbp = open());
  const put = async (k, v) => { const d = await db(); return new Promise((res, rej) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); };
  const get = async k => { const d = await db(); return new Promise((res, rej) => { const r = d.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); };
  const fail = () => toast('저장하지 못했습니다. 저장 공간을 확인해 주세요');
  const st = {
    persisted: false,
    load: async () => ({ S: await get('settings'), TX: await get('tx'), meta: await get('meta') }),
    saveSettings: () => put('settings', JSON.parse(JSON.stringify(S))).catch(fail),
    saveTx: () => put('tx', JSON.parse(JSON.stringify(TX))).catch(fail),
    delTx: () => put('tx', JSON.parse(JSON.stringify(TX))).catch(fail),
    saveMeta: m => put('meta', m).catch(() => {}),
  };
  return st;
}
function lsStore() {
  const K = 'cashbook-v2', dump = () => { try { localStorage.setItem(K, JSON.stringify({ S, TX, meta: { lastExport } })); } catch (e) { toast('저장하지 못했습니다'); } };
  return { persisted: false, load: async () => { try { return JSON.parse(localStorage.getItem(K) || '{}'); } catch (e) { return {}; } }, saveSettings: dump, saveTx: dump, delTx: dump, saveMeta: dump };
}

async function init() {
  const stat = $('#stat');
  store = window.indexedDB ? idbStore() : lsStore();
  try {
    const d = await store.load();
    if (d.S) S = Core.normalize(d.S, todayStr());
    if (Array.isArray(d.TX)) TX = d.TX.filter(t => t && t.id && Number.isFinite(t.amount));
    if (d.meta && d.meta.lastExport) lastExport = d.meta.lastExport;
  } catch (e) { store = lsStore(); const d = await store.load(); if (d.S) S = Core.normalize(d.S, todayStr()); if (d.TX) TX = d.TX; }
  try { if (navigator.storage && navigator.storage.persist) store.persisted = await navigator.storage.persist(); } catch (e) {}
  $('#add').disabled = false;
  stat.textContent = '이 휴대폰에 저장';
  render();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
}
init();
}
